<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, shrink-to-fit=no"
  />

  <meta
    name="description"
    content="GoFive Internal Network Speed Test"
  />

  <link rel="shortcut icon" href="images/favicon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="images/icon-192.png" />

  <meta name="theme-color" content="#09051d" />

  <title>Speed Test GoFive</title>


  <!-- LibreSpeed Engine -->

  <div id="app"></div>

    สร้าง Element ทั้งหมดก่อน

    src="javascript/gofive-dashboard.js"
  ></script>


  <!-- LibreSpeed Modern Controller -->
  <script
    type="text/javascript"
    src="javascript/index.js"
  ></script>
